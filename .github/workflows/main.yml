name: O11 OTT + Private Scripts + SSH

on:
  schedule:
    - cron: "8 */6 * * *"

  workflow_dispatch:


concurrency:
  group: o11-ott-server
  cancel-in-progress: true


jobs:

  o11:

    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      O11_DIR: /home/vpsuser/o11-OTT-v2.2b1
      O11_REPO: https://github.com/DRMStuff/o11-OTT-v2.2b1
      PIP_DISABLE_PIP_VERSION_CHECK: "1"


    steps:

      # ==================================================
      # DEPENDENCIAS DEL SISTEMA
      # ==================================================

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq

          sudo apt-get install -y \
            curl \
            wget \
            jq \
            git \
            rsync \
            openssh-server \
            net-tools \
            tmux \
            ffmpeg \
            file \
            python3 \
            python3-pip \
            python3-venv \
            python3-dev \
            build-essential \
            ca-certificates \
            libffi-dev \
            libssl-dev \
            zlib1g-dev


      # ==================================================
      # CREAR USUARIO
      # ==================================================

      - name: Create VPS user
        env:
          VPS_SSH_PASSWORD: ${{ secrets.VPS_SSH_PASSWORD }}

        run: |
          if [ -z "$VPS_SSH_PASSWORD" ]; then
            echo "ERROR: VPS_SSH_PASSWORD is not configured."
            exit 1
          fi

          if ! id vpsuser >/dev/null 2>&1; then
            sudo useradd \
              -m \
              -s /bin/bash \
              vpsuser
          fi

          echo "vpsuser:$VPS_SSH_PASSWORD" \
            | sudo chpasswd

          sudo usermod \
            -aG sudo \
            vpsuser

          echo "vpsuser ALL=(ALL) NOPASSWD:ALL" \
            | sudo tee \
              /etc/sudoers.d/vpsuser \
              >/dev/null

          sudo chmod 440 \
            /etc/sudoers.d/vpsuser

          echo "User created."


      # ==================================================
      # INSTALAR DEPENDENCIAS PYTHON COMO VPSUSER
      # ==================================================

      - name: Install Python dependencies
        run: |
          echo "Installing Python dependencies for vpsuser..."

          sudo -H -u vpsuser \
            python3 -m pip install \
            --user \
            --break-system-packages \
            --ignore-installed \
            requests \
            urllib3 \
            dnspython \
            requests-toolbelt \
            beautifulsoup4 \
            lxml \
            pycryptodome \
            cryptography \
            m3u8 \
            aiohttp \
            httpx \
            websocket-client \
            PyYAML \
            cloudscraper \
            python-dateutil \
            brotli \
            xmltodict \
            certifi \
            charset-normalizer \
            idna

          echo
          echo "===== PYTHON USER SITE ====="

          sudo -H -u vpsuser \
            python3 -m site

          echo
          echo "===== INSTALLED PACKAGES ====="

          sudo -H -u vpsuser \
            python3 -m pip list \
            --user


      # ==================================================
      # PROBAR DEPENDENCIAS
      # ==================================================

      - name: Test Python dependencies
        run: |
          echo "Testing Python modules as vpsuser..."

          sudo -H -u vpsuser \
            python3 - <<'PY'
          import requests
          import urllib3

          import dns
          import dns.resolver

          import requests_toolbelt
          import bs4
          import lxml

          from Crypto.Cipher import AES

          import cryptography
          import m3u8
          import aiohttp
          import httpx
          import websocket
          import yaml
          import cloudscraper
          import dateutil
          import brotli
          import xmltodict

          print("")
          print("========================================")
          print("PYTHON DEPENDENCIES OK")
          print("========================================")
          print("requests:", requests.__version__)
          print("urllib3:", urllib3.__version__)
          print("dnspython:", dns.__version__)
          print("requests-toolbelt: OK")
          print("beautifulsoup4: OK")
          print("lxml: OK")
          print("pycryptodome: OK")
          print("cryptography: OK")
          print("m3u8: OK")
          print("aiohttp: OK")
          print("httpx: OK")
          print("websocket-client: OK")
          print("cloudscraper: OK")
          print("========================================")
          PY


      # ==================================================
      # CONFIGURAR SSH
      # ==================================================

      - name: Configure SSH
        run: |
          echo "Preparing SSH..."

          sudo install \
            -d \
            -m 0755 \
            -o root \
            -g root \
            /run/sshd

          sudo mkdir -p \
            /etc/ssh/sshd_config.d

          printf '%s\n' \
            'PasswordAuthentication yes' \
            'PermitRootLogin no' \
            'UsePAM yes' \
            | sudo tee \
              /etc/ssh/sshd_config.d/99-vps.conf \
              >/dev/null

          sudo ssh-keygen -A

          sudo /usr/sbin/sshd -t

          sudo systemctl restart ssh.service \
            2>/dev/null \
            || sudo service ssh restart \
            2>/dev/null \
            || sudo /usr/sbin/sshd

          sleep 2

          echo
          echo "===== SSH ====="

          sudo ss \
            -lntp \
            | grep ':22' \
            || true

          if ! sudo ss -lnt \
            | grep -q ':22 '; then

            echo "ERROR: SSH is not listening on port 22."

            exit 1
          fi


      # ==================================================
      # INSTALAR BORE
      # ==================================================

      - name: Install Bore
        run: |
          echo "Finding latest Bore release..."

          BORE_URL="$(
            curl -fsSL \
              https://api.github.com/repos/ekzhang/bore/releases/latest \
            | jq -r '
                .assets[]
                | select(
                    .name
                    | endswith("x86_64-unknown-linux-musl.tar.gz")
                  )
                | .browser_download_url
              ' \
            | head -n 1
          )"

          if [ -z "$BORE_URL" ] \
             || [ "$BORE_URL" = "null" ]; then

            echo "ERROR: Bore binary not found."

            exit 1
          fi

          curl \
            -fsSL \
            "$BORE_URL" \
            -o /tmp/bore.tar.gz

          rm -rf \
            /tmp/bore-install

          mkdir -p \
            /tmp/bore-install

          tar \
            -xzf /tmp/bore.tar.gz \
            -C /tmp/bore-install

          sudo install \
            -m 755 \
            /tmp/bore-install/bore \
            /usr/local/bin/bore

          bore --version


      # ==================================================
      # INICIAR BORE
      # ==================================================

      - name: Start Bore SSH tunnel
        run: |
          nohup bore \
            local 22 \
            --to bore.pub \
            > /tmp/bore.log \
            2>&1 &

          echo $! \
            > /tmp/bore.pid

          PORT=""

          for i in $(seq 1 30); do

            PORT="$(
              grep -oE \
                'bore\.pub:[0-9]+' \
                /tmp/bore.log \
              | tail -n 1 \
              | cut -d: -f2
            )"

            if [ -n "$PORT" ]; then
              break
            fi

            sleep 1
          done

          echo
          echo "===== BORE LOG ====="

          cat /tmp/bore.log || true

          if [ -z "$PORT" ]; then

            echo "ERROR: Could not obtain Bore port."

            exit 1
          fi

          echo "$PORT" \
            > /tmp/bore.port

          echo
          echo "============================================"
          echo "SSH READY"
          echo "============================================"
          echo
          echo "ssh vpsuser@bore.pub -p $PORT"
          echo
          echo "============================================"


      # ==================================================
      # CLONAR O11
      # ==================================================

      - name: Clone O11 OTT Streamer
        run: |
          echo "Cloning O11..."

          sudo rm -rf \
            "$O11_DIR"

          sudo -H -u vpsuser \
            git clone \
              "$O11_REPO" \
              "$O11_DIR"

          echo
          echo "Repository:"

          sudo -H -u vpsuser \
            ls -la \
            "$O11_DIR"


      # ==================================================
      # INSTALAR SCRIPTS PRIVADOS
      # ==================================================

      - name: Install private O11 scripts
        env:
          O11_SCRIPTS_B64: ${{ secrets.O11_SCRIPTS_B64 }}

        run: |
          if [ -z "$O11_SCRIPTS_B64" ]; then

            echo "ERROR: O11_SCRIPTS_B64 is not configured."

            exit 1
          fi

          echo "Installing private scripts..."

          WORK_DIR="$(mktemp -d)"

          printf '%s' "$O11_SCRIPTS_B64" \
            | base64 --decode \
            > "$WORK_DIR/o11-scripts.tar.gz"

          echo "Checking archive..."

          tar \
            -tzf "$WORK_DIR/o11-scripts.tar.gz" \
            >/dev/null

          echo "Extracting archive..."

          tar \
            -xzf "$WORK_DIR/o11-scripts.tar.gz" \
            -C "$WORK_DIR"

          if [ ! -d "$WORK_DIR/scripts" ]; then

            echo "ERROR: scripts directory not found."

            rm -rf "$WORK_DIR"

            exit 1
          fi

          sudo mkdir -p \
            "$O11_DIR/scripts"

          sudo rsync \
            -a \
            --delete \
            "$WORK_DIR/scripts/" \
            "$O11_DIR/scripts/"

          sudo chown \
            -R vpsuser:vpsuser \
            "$O11_DIR/scripts"

          sudo find \
            "$O11_DIR/scripts" \
            -type f \
            -name "*.py" \
            -exec chmod 700 {} \;

          rm -rf \
            "$WORK_DIR"

          echo
          echo "===== PRIVATE SCRIPTS ====="

          sudo -H -u vpsuser \
            find \
              "$O11_DIR/scripts" \
              -maxdepth 2 \
              -type f \
              -printf '%P\n' \
            | sort


      # ==================================================
      # REQUIREMENTS.TXT PRIVADO
      # ==================================================

      - name: Install private requirements
        run: |
          REQUIREMENTS="$O11_DIR/scripts/requirements.txt"

          if [ -f "$REQUIREMENTS" ]; then

            echo "requirements.txt found."
            echo "Installing private requirements..."

            sudo -H -u vpsuser \
              python3 -m pip install \
              --user \
              --break-system-packages \
              --ignore-installed \
              -r "$REQUIREMENTS"

          else

            echo "No requirements.txt found."
            echo "Using preinstalled dependencies."

          fi


      # ==================================================
      # PROBAR O11.PY
      # ==================================================

      - name: Test O11 Python helper
        run: |
          cd "$O11_DIR/scripts"

          echo "Testing o11.py dependencies..."

          sudo -H -u vpsuser \
            python3 - <<'PY'
          import sys

          sys.path.insert(
              0,
              "/home/vpsuser/o11-OTT-v2.2b1/scripts"
          )

          import dns.resolver
          import requests
          import urllib3
          import requests_toolbelt
          import o11

          print("")
          print("========================================")
          print("O11.PY IMPORT OK")
          print("========================================")
          PY


      # ==================================================
      # COMPILAR SCRIPTS
      # ==================================================

      - name: Compile Python scripts
        run: |
          echo "Checking Python syntax..."

          while IFS= read -r -d '' SCRIPT; do

            echo "Checking: $SCRIPT"

            sudo -H -u vpsuser \
              python3 \
              -m py_compile \
              "$SCRIPT"

          done < <(
            find "$O11_DIR/scripts" \
              -type f \
              -name "*.py" \
              -print0
          )

          echo
          echo "Python syntax OK."


      # ==================================================
      # PERMISOS
      # ==================================================

      - name: Set O11 permissions
        run: |
          sudo chown \
            -R vpsuser:vpsuser \
            "$O11_DIR"

          sudo chmod +x \
            "$O11_DIR/o11_v22b1-DRMStuff"

          sudo find \
            "$O11_DIR/scripts" \
            -type f \
            -name "*.py" \
            -exec chmod 700 {} \;

          echo
          echo "Binary:"

          ls -lh \
            "$O11_DIR/o11_v22b1-DRMStuff"


      # ==================================================
      # TMPFS HLS
      # ==================================================

      - name: Prepare HLS RAM filesystem
        run: |
          echo "Preparing HLS tmpfs..."

          UID_VPS="$(id -u vpsuser)"
          GID_VPS="$(id -g vpsuser)"

          sudo mkdir -p \
            "$O11_DIR/hls"

          sudo chown \
            vpsuser:vpsuser \
            "$O11_DIR/hls"

          if mountpoint -q "$O11_DIR/hls"; then

            sudo umount \
              "$O11_DIR/hls"

          fi

          sudo mount \
            -t tmpfs \
            -o "size=2G,uid=${UID_VPS},gid=${GID_VPS},mode=0755" \
            tmpfs \
            "$O11_DIR/hls"

          sudo -H -u vpsuser \
            mkdir -p \
            "$O11_DIR/hls/live" \
            "$O11_DIR/hls/replay"

          sudo chown \
            -R vpsuser:vpsuser \
            "$O11_DIR/hls"

          sudo chmod \
            755 \
            "$O11_DIR/hls" \
            "$O11_DIR/hls/live" \
            "$O11_DIR/hls/replay"

          echo
          echo "===== HLS TMPFS ====="

          df -hT \
            "$O11_DIR/hls"

          echo
          echo "===== WRITE TEST ====="

          sudo -H -u vpsuser \
            touch \
            "$O11_DIR/hls/.test"

          sudo -H -u vpsuser \
            touch \
            "$O11_DIR/hls/live/.test"

          sudo -H -u vpsuser \
            touch \
            "$O11_DIR/hls/replay/.test"

          sudo -H -u vpsuser \
            rm -f \
            "$O11_DIR/hls/.test" \
            "$O11_DIR/hls/live/.test" \
            "$O11_DIR/hls/replay/.test"

          echo "HLS write test OK."


      # ==================================================
      # INICIAR O11
      # ==================================================

      - name: Start O11 OTT Streamer
        run: |
          sudo -H -u vpsuser \
            bash -c "
              cd '$O11_DIR'

              export PATH=\"/home/vpsuser/.local/bin:\$PATH\"
              export PYTHONUSERBASE=\"/home/vpsuser/.local\"

              nohup ./o11_v22b1-DRMStuff \
                > o11.log \
                2>&1 &

              echo \$! > o11.pid
            "

          echo
          echo "O11 PID:"

          cat \
            "$O11_DIR/o11.pid"

          sleep 3

          echo
          echo "===== INITIAL O11 LOG ====="

          cat \
            "$O11_DIR/o11.log" \
            || true


      # ==================================================
      # ESPERAR O11
      # ==================================================

      - name: Wait for O11 dashboard
        run: |
          echo "Waiting for O11 on port 1234..."

          for i in $(seq 1 60); do

            if curl \
              -fsS \
              http://127.0.0.1:1234/ \
              >/dev/null; then

              echo
              echo "============================================"
              echo "O11 IS RUNNING"
              echo "============================================"

              exit 0
            fi

            echo
            echo "Attempt $i/60..."

            if [ -f "$O11_DIR/o11.log" ]; then

              tail -20 \
                "$O11_DIR/o11.log"

            fi

            if [ -f "$O11_DIR/o11.pid" ]; then

              PID="$(cat "$O11_DIR/o11.pid")"

              if ! kill -0 "$PID" 2>/dev/null; then

                echo
                echo "ERROR: O11 process stopped."

                cat \
                  "$O11_DIR/o11.log" \
                  || true

                exit 1
              fi

            fi

            sleep 5

          done

          echo
          echo "O11 failed to start."

          cat \
            "$O11_DIR/o11.log" \
            || true

          exit 1


      # ==================================================
      # CLOUDFLARE
      # ==================================================

      - name: Start Cloudflare Tunnel
        env:
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}

        run: |
          if [ -z "$CLOUDFLARE_TUNNEL_TOKEN" ]; then

            echo "ERROR: CLOUDFLARE_TUNNEL_TOKEN is not configured."

            exit 1
          fi

          docker rm \
            -f cloudflared \
            2>/dev/null \
            || true

          docker run \
            -d \
            --name cloudflared \
            --network host \
            cloudflare/cloudflared:latest \
            tunnel \
            --no-autoupdate \
            run \
            --token "$CLOUDFLARE_TUNNEL_TOKEN"


      # ==================================================
      # VERIFICAR CLOUDFLARE
      # ==================================================

      - name: Verify Cloudflare Tunnel
        run: |
          sleep 10

          echo
          echo "===== CLOUDFLARED ====="

          docker ps \
            --filter name=cloudflared

          echo
          echo "===== CLOUDFLARED LOG ====="

          docker logs \
            cloudflared \
            --tail 100


      # ==================================================
      # DATOS DE ACCESO
      # ==================================================

      - name: Show access information
        run: |
          PORT="$(cat /tmp/bore.port)"

          echo
          echo "============================================"
          echo "O11 SERVER READY"
          echo "============================================"
          echo
          echo "SSH:"
          echo
          echo "ssh vpsuser@bore.pub -p $PORT"
          echo
          echo "O11:"
          echo
          echo "http://127.0.0.1:1234"
          echo
          echo "Directory:"
          echo
          echo "$O11_DIR"
          echo
          echo "Scripts:"
          echo
          echo "$O11_DIR/scripts"
          echo
          echo "============================================"


      # ==================================================
      # COMPROBACIÓN FINAL
      # ==================================================

      - name: Final service check
        run: |
          echo
          echo "===== O11 ====="

          curl \
            -I \
            http://127.0.0.1:1234/ \
            || true

          echo
          echo "===== O11 PROCESS ====="

          ps aux \
            | grep '[o]11' \
            || true

          echo
          echo "===== PORT 22 ====="

          sudo ss \
            -lntp \
            | grep ':22' \
            || true

          echo
          echo "===== PORT 1234 ====="

          sudo ss \
            -lntp \
            | grep ':1234' \
            || true

          echo
          echo "===== PYTHON USER PACKAGES ====="

          sudo -H -u vpsuser \
            python3 -m pip list \
            --user \
            || true

          echo
          echo "===== HLS ====="

          df -hT \
            "$O11_DIR/hls" \
            || true


      # ==================================================
      # KEEP ALIVE
      # ==================================================

      - name: Keep server alive
        run: |
          PORT="$(cat /tmp/bore.port)"

          echo
          echo "============================================"
          echo "SERVER RUNNING"
          echo "============================================"
          echo
          echo "SSH:"
          echo
          echo "ssh vpsuser@bore.pub -p $PORT"
          echo
          echo "============================================"

          sleep 20700


      # ==================================================
      # LOGS
      # ==================================================

      - name: Show logs
        if: always()

        run: |
          echo
          echo "============================================"
          echo "O11 LOG"
          echo "============================================"

          cat \
            "$O11_DIR/o11.log" \
            2>/dev/null \
            || true

          echo
          echo "============================================"
          echo "BORE LOG"
          echo "============================================"

          cat \
            /tmp/bore.log \
            2>/dev/null \
            || true

          echo
          echo "============================================"
          echo "CLOUDFLARED LOG"
          echo "============================================"

          docker logs \
            cloudflared \
            --tail 500 \
            2>/dev/null \
            || true

          echo
          echo "============================================"
          echo "PYTHON PACKAGES"
          echo "============================================"

          sudo -H -u vpsuser \
            python3 -m pip list \
            --user \
            2>/dev/null \
            || true


      # ==================================================
      # CLEANUP
      # ==================================================

      - name: Cleanup
        if: always()

        run: |
          echo "Stopping Cloudflare..."

          docker rm \
            -f cloudflared \
            2>/dev/null \
            || true

          echo "Stopping Bore..."

          if [ -f /tmp/bore.pid ]; then

            sudo kill \
              "$(cat /tmp/bore.pid)" \
              2>/dev/null \
              || true

          fi

          echo "Stopping O11..."

          if [ -f "$O11_DIR/o11.pid" ]; then

            sudo kill \
              "$(cat "$O11_DIR/o11.pid")" \
              2>/dev/null \
              || true

          fi

          sleep 2

          echo "Unmounting HLS tmpfs..."

          if mountpoint -q "$O11_DIR/hls"; then

            sudo umount \
              "$O11_DIR/hls" \
              || true

          fi

          echo "Cleanup complete."
