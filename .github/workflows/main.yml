name: Run O11 OTT Streamer for 6 hours

on:
  schedule:
    - cron: "8 */6 * * *"
  workflow_dispatch:

jobs:
  o11:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update

      - name: Clone O11 OTT Streamer
        run: |
          cd "$GITHUB_WORKSPACE"

          git clone \
            https://github.com/DRMStuff/o11-OTT-v2.2b1 \
            o11-OTT-Streamer

          echo "Repository cloned:"
          ls -la "$GITHUB_WORKSPACE/o11-OTT-Streamer"

      - name: Set permissions
        working-directory: ${{ github.workspace }}/o11-OTT-Streamer
        run: |
          chmod +x o11_v22b1-DRMStuff

          echo "Binary:"
          ls -lh ./o11

      - name: Start O11 OTT Streamer
        working-directory: ${{ github.workspace }}/o11-OTT-Streamer
        run: |
          nohup ./o11 \
            > o11.log 2>&1 &

          echo $! > o11.pid

          echo "O11 PID:"
          cat o11.pid

      - name: Wait for O11 dashboard
        run: |
          echo "Waiting for O11 OTT Streamer on port 1234..."

          for i in {1..60}; do

            if curl -fsS \
              http://127.0.0.1:1234/ \
              > /dev/null; then

              echo
              echo "========================================"
              echo "O11 OTT Streamer is running!"
              echo "========================================"

              exit 0
            fi

            if [ -f "$GITHUB_WORKSPACE/o11-OTT-Streamer/o11.log" ]; then
              echo "--- O11 log ---"
              tail -20 \
                "$GITHUB_WORKSPACE/o11-OTT-Streamer/o11.log"
            fi

            echo "Attempt $i/60..."
            sleep 5
          done

          echo
          echo "O11 failed to start."

          echo
          echo "===== O11 LOG ====="

          cat \
            "$GITHUB_WORKSPACE/o11-OTT-Streamer/o11.log" \
            || true

          echo
          echo "===== LISTENING PORTS ====="

          ss -lntp || true

          echo
          echo "===== PROCESS ====="

          ps aux | grep '[o]11_streamer' || true

          exit 1

      - name: Start Cloudflare Tunnel
        env:
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_TUNNEL_TOKEN" ]; then
            echo "ERROR: CLOUDFLARE_TUNNEL_TOKEN is not configured."
            exit 1
          fi

          docker run -d \
            --name cloudflared \
            --network host \
            cloudflare/cloudflared:latest \
            tunnel \
            --no-autoupdate \
            run \
            --token "$CLOUDFLARE_TUNNEL_TOKEN"

      - name: Verify Cloudflare Tunnel
        run: |
          sleep 10

          echo "===== CLOUDFLARED CONTAINER ====="

          docker ps \
            --filter name=cloudflared

          echo
          echo "===== CLOUDFLARED LOG ====="

          docker logs \
            cloudflared \
            --tail 100

      - name: Final service check
        run: |
          echo "===== O11 ====="

          curl -I \
            http://127.0.0.1:1234/ \
            || true

          echo
          echo "===== O11 PROCESS ====="

          ps aux | grep '[o]11_streamer' || true

          echo
          echo "===== PORT 1234 ====="

          ss -lntp | grep ':1234' || true

          echo
          echo "===== CLOUDFLARED ====="

          docker ps \
            --filter name=cloudflared

      - name: Keep O11 running for 6 hours
        run: |
          echo
          echo "=========================================="
          echo "O11 OTT STREAMER IS RUNNING"
          echo "=========================================="
          echo
          echo "Local dashboard:"
          echo "http://127.0.0.1:1234"
          echo
          echo "Cloudflare Tunnel:"
          echo "RUNNING"
          echo
          echo "Keeping everything alive for 6 hours..."
          echo
          echo "=========================================="

          sleep 21600

      - name: Show logs
        if: always()
        run: |
          echo "=========================================="
          echo "O11 LOG"
          echo "=========================================="

          cat \
            "$GITHUB_WORKSPACE/o11-OTT-Streamer/o11.log" \
            || true

          echo
          echo "=========================================="
          echo "CLOUDFLARED LOG"
          echo "=========================================="

          docker logs \
            cloudflared \
            --tail 500 \
            || true

          echo
          echo "=========================================="
          echo "PROCESSES"
          echo "=========================================="

          ps aux | grep -E \
            '[o]11_streamer|[c]loudflared' \
            || true

      - name: Cleanup
        if: always()
        run: |
          echo "Stopping Cloudflare Tunnel..."

          docker rm -f cloudflared \
            2>/dev/null || true

          echo "Stopping O11..."

          if [ -f "$GITHUB_WORKSPACE/o11-OTT-Streamer/o11.pid" ]; then
            kill \
              "$(cat "$GITHUB_WORKSPACE/o11-OTT-Streamer/o11.pid")" \
              2>/dev/null || true
          fi

          echo "Cleanup complete."
